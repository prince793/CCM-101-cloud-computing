# CloudNova - WordPress + MariaDB (two-tier stack)
# Secrets are read from a local .env file (see .env.example). Never commit .env.
services:
  db:
    image: mariadb:11
    container_name: cloudnova-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql      # persistent database storage
    networks:
      - backend                     # no "ports:" -> database is not reachable from outside

  wordpress:
    image: wordpress:latest
    container_name: cloudnova-wp
    restart: always
    depends_on:
      - db
    ports:
      - "80:80"                     # the only published port
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html       # persistent WordPress files/uploads
    networks:
      - backend

volumes:
  db_data:
  wp_data:

networks:
  backend:
